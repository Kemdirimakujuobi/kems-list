<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Desk · Kem's List</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .desk { max-width: 1180px; margin: 0 auto; padding: 0 16px 80px; }
  .desk-top { max-width: 1180px; }
  .panes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 440px); gap: 20px; align-items: start; }
  .panes .rows { min-width: 0; }
  .row { grid-template-columns: 28px 150px minmax(0, 1fr) auto; }
  .row.is-dim { opacity: .55; }
  .pane { position: sticky; top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px 26px; }
  .pane h2 { font-size: 19px; line-height: 1.3; margin: 0 0 10px; }
  .pane .byline { font-size: 14px; }
  .pane .excerpt { font-size: 15px; margin-bottom: 18px; }
  .pane .links { font-size: 14px; margin: 0 0 18px; }
  .pane .links a { color: var(--accent); }
  .pane-empty { color: var(--muted); text-align: center; padding: 48px 8px; }
  .field { display: block; margin: 0 0 14px; }
  .field span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field input, .field textarea {
    width: 100%; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 9px 11px; resize: vertical;
  }
  .field textarea { min-height: 70px; }
  .buttons { display: flex; gap: 10px; flex-wrap: wrap; }
  .button.quiet { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .button.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); }
  .button[disabled] { opacity: .5; cursor: default; }
  kbd { font: 11px/1 var(--font); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 2px 5px; margin-left: 6px; }
  .count { color: var(--muted); font-size: 12px; margin-left: 4px; }
  .status-line { color: var(--muted); font-size: 12px; margin: 4px 0 18px 10px; }
  .fail { color: var(--danger); font-size: 13px; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px;
    display: flex; gap: 14px; align-items: center; max-width: calc(100% - 32px); box-shadow: 0 6px 24px rgba(0,0,0,.18);
  }
  .toast button { background: none; border: 0; color: inherit; font: inherit; text-decoration: underline; cursor: pointer; padding: 0; }
  .toast.error { background: var(--danger); color: #fff; white-space: pre-line; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: grid; place-items: center; padding: 16px; z-index: 10; }
  .dialog { background: var(--surface); border-radius: 12px; padding: 26px; width: min(460px, 100%); border: 1px solid var(--line); }
  .dialog h2 { margin: 0 0 14px; font-size: 17px; }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 14px; margin: 0; }
  .keys dt kbd { margin: 0; }
  .unlock { max-width: 460px; margin: 60px auto; }
  .unlock p { color: var(--ink-soft); font-size: 14px; }
  .unlock ol { color: var(--ink-soft); font-size: 14px; padding-left: 18px; }
  .back { display: none; }
  @media (max-width: 640px) {
    .desk-top { flex-direction: column; align-items: flex-start; gap: 10px; }
    .desk-top nav { flex-wrap: wrap; gap: 8px 16px; }
    .desk-top [data-do="help"], kbd { display: none; }
  }
  @media (max-width: 900px) {
    .panes { grid-template-columns: 1fr; }
    .panes.is-open .rows-wrap { display: none; }
    .panes:not(.is-open) .pane { display: none; }
    .pane { position: static; }
    .back { display: inline-block; margin-bottom: 12px; color: var(--muted); background: none; border: 0; font: inherit; padding: 0; cursor: pointer; }
  }
</style>
</head>
<body>
<div id="app"><p class="empty">Loading…</p></div>
<script type="module" src="./desk.js"></script>
</body>
</html>
